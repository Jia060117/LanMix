name: Rust desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: windows-x64
          - os: ubuntu-22.04
            package: linux-x64
          - os: macos-15
            package: macos-arm64
          - os: macos-15-intel
            package: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Update deliberately after checking new compiler/Clippy diagnostics locally.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - if: runner.os == 'Windows'
        run: cargo test --manifest-path vendor/cpal/Cargo.toml --lib
      - run: cargo build --locked --release -p lanmix-sender -p lanmix-receiver
      - run: python scripts/smoke_test.py --bin-dir target/release
      - name: Package desktop binaries
        run: python scripts/package-desktop.py --platform ${{ matrix.package }}
      - name: Upload desktop download
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LanMix-${{ matrix.package }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
